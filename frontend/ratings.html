<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResellingBot — Ratings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="card log-page-card">
      <!-- Header -->
      <div class="header">
        <div class="header-title">
          <svg
            class="logo-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" />
          </svg>
          <h1>Ratings</h1>
        </div>
        <a href="/" class="btn-set" style="text-decoration: none"
          >← Dashboard</a
        >
      </div>

      <!-- Summary -->
      <div class="ratings-summary" id="ratingsSummary"></div>

      <!-- Controls -->
      <div class="log-toolbar">
        <div class="log-toolbar-left">
          <label class="log-lines-label">
            Show:
            <select id="ratingFilter" class="log-lines-select">
              <option value="rated" selected>Rated</option>
              <option value="up">👍 only</option>
              <option value="down">👎 only</option>
              <option value="none">Unrated</option>
              <option value="all">All notified</option>
            </select>
          </label>
          <label class="log-lines-label">
            Search:
            <select id="searchFilter" class="log-lines-select">
              <option value="">All</option>
            </select>
          </label>
        </div>
      </div>

      <!-- Table -->
      <div class="ratings-table-wrap">
        <table class="ratings-table">
          <thead>
            <tr>
              <th></th>
              <th>Listing</th>
              <th>Search</th>
              <th class="num">Price</th>
              <th>Notified</th>
            </tr>
          </thead>
          <tbody id="ratingsBody"></tbody>
        </table>
        <p class="ratings-empty" id="ratingsEmpty" hidden>No listings match this filter.</p>
      </div>
    </div>

    <script src="{{ url_for('static', filename='ratings.js') }}" defer></script>
  </body>
</html>
